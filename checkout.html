<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout — Ravens Scoops</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  width: 100%;

  background: #08030d;
  color: white;

  font-family: Arial, sans-serif;
}


/* NAVIGATION */

nav {
  position: relative;

  width: 100%;

  text-align: center;

  padding: 30px 10px;

  background:
    radial-gradient(
      circle at center,
      #55206f 0%,
      #411456 48%,
      #291033 100%
    );

  border-top:
    1px solid rgba(225, 228, 235, 0.20);

  border-bottom:
    1px solid #bfc3cc;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);

  overflow: hidden;

  z-index: 10;
}


/* SILVER SHINE */

nav::before {
  content: "";

  position: absolute;

  top: 0;
  left: 10%;

  width: 80%;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  z-index: 3;
}


/* BLACK LACE */

.nav-lace {
  position: absolute;

  top: 0;

  width: 36%;
  height: 100%;

  object-fit: cover;
  object-position: left center;

  pointer-events: none;

  z-index: 1;

  filter:
    grayscale(1)
    contrast(1.65);

  mix-blend-mode: multiply;

  opacity: 0.88;
}


.lace-left {
  left: 0;

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


.lace-right {
  right: 0;

  transform: scaleX(-1);

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


/* CENTER SHADE */

.nav-center-shade {
  position: absolute;

  top: 0;
  left: 22%;

  width: 56%;
  height: 100%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(31, 7, 41, .94) 0%,
      rgba(31, 7, 41, .80) 48%,
      rgba(31, 7, 41, .36) 72%,
      transparent 100%
    );

  pointer-events: none;

  z-index: 2;
}


/* NAV LINKS */

nav a {
  position: relative;

  z-index: 5;

  color: #f5f1f7;

  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 19px;

  font-weight: normal;

  letter-spacing: 1px;

  margin: 0 24px;

  text-shadow:
    0 1px 4px rgba(0,0,0,.95);

  transition:
    color .25s ease,
    text-shadow .25s ease;
}


nav a::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  width: 0;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      #ffffff,
      transparent
    );

  transform: translateX(-50%);

  transition: width .25s ease;
}


nav a:hover {
  color: #ffffff;

  text-shadow:
    0 0 8px rgba(220,205,255,.85),
    0 0 15px rgba(130,70,175,.6);
}


nav a:hover::after {
  width: 100%;
}


/* CENTER ORNAMENT */

.nav-ornament {
  position: absolute;

  left: 50%;
  bottom: 2px;

  transform: translateX(-50%);

  color: #e0e2e8;

  font-size: 9px;

  letter-spacing: 8px;

  z-index: 6;

  opacity: .85;

  white-space: nowrap;
}


/* MAIN PAGE */

main {
  width: 90%;

  max-width: 900px;

  margin: 55px auto 70px;
}


/* PAGE TITLE */

h1 {
  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 44px;

  margin-bottom: 35px;
}


/* CHECKOUT BOX */

.checkout-box {
  background:
    linear-gradient(
      145deg,
      #13091b,
      #0d0612
    );

  border:
    1px solid #554560;

  border-radius: 18px;

  padding: 38px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.025);
}


.checkout-box h2 {
  margin-top: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 30px;

  text-align: center;
}


/* CHECKOUT MESSAGE */

.checkout-message {
  text-align: center;

  color: #c9c0d0;

  padding: 25px 10px 10px;

  line-height: 1.7;

  font-size: 17px;
}


/* CHECKOUT BUTTON */

.checkout-button {
  display: block;

  width: 100%;

  margin-top: 25px;

  padding: 16px;

  background:
    linear-gradient(
      135deg,
      #8c55a7,
      #5c2b76
    );

  color: white;

  border:
    1px solid rgba(220,220,230,.55);

  border-radius: 8px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 18px;

  font-weight: normal;

  letter-spacing: .5px;

  text-align: center;

  text-decoration: none;

  cursor: pointer;

  box-shadow:
    0 8px 22px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.12);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}


.checkout-button:hover {
  transform: translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #a36cc0,
      #693685
    );

  box-shadow:
    0 10px 26px rgba(0,0,0,.45),
    0 0 15px rgba(147,93,181,.25);
}


/* SECURE MESSAGE */

.secure {
  text-align: center;

  color: #9f95a5;

  font-size: 14px;

  margin-top: 18px;
}


/* MOBILE */

@media screen and (max-width: 600px) {

  nav {
    padding: 20px 3px;
  }


  nav a {
    font-size: 14px;

    margin: 0 5px;

    letter-spacing: 0;
  }


  .nav-lace {
    width: 30%;

    filter:
      grayscale(1)
      contrast(1.6);

    opacity: 0.82;
  }


  .nav-center-shade {
    left: 15%;

    width: 70%;
  }


  .nav-ornament {
    font-size: 7px;

    letter-spacing: 4px;

    bottom: 1px;
  }


  main {
    width: 92%;

    margin-top: 40px;
  }


  h1 {
    font-size: 36px;
  }


  .checkout-box {
    padding: 25px 20px;
  }


  .checkout-box h2 {
    font-size: 26px;
  }


  .checkout-message {
    font-size: 16px;
  }

}

</style>

</head>

<body>


<nav>

  <img
    src="lace.jpg"
    class="nav-lace lace-left"
    alt=""
  >


  <img
    src="lace.jpg"
    class="nav-lace lace-right"
    alt=""
  >


  <span class="nav-center-shade"></span>


  <a href="index.html">
    Home
  </a>


  <a href="boxes.html">
    Boxes
  </a>


  <a href="about.html">
    About Us
  </a>


  <a href="contact.html">
    Contact
  </a>


  <a href="checkout.html">
    Checkout
  </a>


  <span class="nav-ornament">
    ◆ ✦ ◆ ✦ ◆
  </span>

</nav>



<main>


  <h1>
    Checkout
  </h1>


  <div class="checkout-box">


    <h2>
      Complete Your Order
    </h2>


    <div class="checkout-message">

      You're almost there! Continue to our secure Square checkout
      to complete your Ravens Scoops order.

    </div>


    <a
      class="checkout-button"
      href="https://square.link/u/gJmoBJvQ"
    >
      Proceed to Secure Checkout
    </a>


    <div class="secure">

      Secure payment processing provided by Square.

    </div>


  </div>


</main>


</body>

</html>
