<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Ravens Scoops</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #08030d;
  color: white;
  font-family: Arial, sans-serif;
}

/* Navigation */
nav {
  width: 100%;
  text-align: center;
  padding: 20px 10px;
  border-bottom: 1px solid #2d2435;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 18px;
  margin: 0 18px;
}

nav a:hover {
  text-decoration: underline;
}

/* Main page */
main {
  width: 90%;
  max-width: 900px;
  margin: 50px auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin-bottom: 40px;
}

/* Checkout box */
.checkout-box {
  background: #110918;
  border: 1px solid #392b45;
  border-radius: 12px;
  padding: 30px;
}

.checkout-box h2 {
  margin-top: 0;
}

.checkout-message {
  text-align: center;
  color: #c9c0d0;
  padding: 35px 10px;
  line-height: 1.6;
}

/* Checkout button */
.checkout-button {
  display: block;
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  background: #d99582;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}

.checkout-button:hover {
  opacity: 0.9;
}

/* Secure message */
.secure {
  text-align: center;
  color: #9f95a5;
  font-size: 14px;
  margin-top: 15px;
}

/* Mobile */
@media (max-width: 600px) {
  nav a {
    margin: 0 8px;
    font-size: 15px;
  }

  h1 {
    font-size: 34px;
  }

  .checkout-box {
    padding: 20px;
  }
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="boxes.html">Boxes</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
  <a href="checkout.html">Checkout</a>
</nav>

<main>

  <h1>Checkout</h1>

  <div class="checkout-box">

    <h2>Complete Your Order</h2>

    <div class="checkout-message">
      You're almost there! Continue to our secure Square checkout
      to complete your Ravens Scoops order.
    </div>

    <a
      class="checkout-button"
      href="https://square.link/u/gJmoBJvQ"
    >
      Proceed to Secure Checkout
    </a>

    <div class="secure">
      Secure payment processing provided by Square.
    </div>

  </div>

</main>

</body>
</html>
