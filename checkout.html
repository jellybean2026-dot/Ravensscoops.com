<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checkout — Ravens Scoops</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  width: 100%;
  background: #08030d;
  color: white;
  font-family: Arial, sans-serif;
}


/* NAVIGATION */

nav {
  position: relative;
  width: 100%;
  text-align: center;
  padding: 30px 10px;

  background:
    radial-gradient(
      circle at center,
      #55206f 0%,
      #411456 48%,
      #291033 100%
    );

  border-top: 1px solid rgba(225, 228, 235, 0.20);
  border-bottom: 1px solid #bfc3cc;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);

  overflow: hidden;
  z-index: 10;
}

nav::before {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  width: 80%;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  z-index: 3;
}


/* BLACK LACE */

.nav-lace {
  position: absolute;
  top: 0;
  width: 36%;
  height: 100%;
  object-fit: cover;
  object-position: left center;
  pointer-events: none;
  z-index: 1;
  filter: grayscale(1) contrast(1.65);
  mix-blend-mode: multiply;
  opacity: 0.88;
}

.lace-left {
  left: 0;

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}

.lace-right {
  right: 0;
  transform: scaleX(-1);

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


/* CENTER SHADE */

.nav-center-shade {
  position: absolute;
  top: 0;
  left: 22%;
  width: 56%;
  height: 100%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(31, 7, 41, .94) 0%,
      rgba(31, 7, 41, .80) 48%,
      rgba(31, 7, 41, .36) 72%,
      transparent 100%
    );

  pointer-events: none;
  z-index: 2;
}


/* NAV LINKS */

nav a {
  position: relative;
  z-index: 5;
  color: #f5f1f7;
  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 19px;
  font-weight: normal;
  letter-spacing: 1px;
  margin: 0 24px;

  text-shadow:
    0 1px 4px rgba(0,0,0,.95);

  transition:
    color .25s ease,
    text-shadow .25s ease;
}

nav a::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 0;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      #ffffff,
      transparent
    );

  transform: translateX(-50%);
  transition: width .25s ease;
}

nav a:hover {
  color: #ffffff;

  text-shadow:
    0 0 8px rgba(220,205,255,.85),
    0 0 15px rgba(130,70,175,.6);
}

nav a:hover::after {
  width: 100%;
}


/* CENTER ORNAMENT */

.nav-ornament {
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  color: #e0e2e8;
  font-size: 9px;
  letter-spacing: 8px;
  z-index: 6;
  opacity: .85;
  white-space: nowrap;
}


/* CHECKOUT */

main {
  width: 92%;
  max-width: 1000px;
  margin: 50px auto 70px;
}

h1 {
  text-align: center;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 44px;
  margin-bottom: 35px;
}

.checkout-layout {
  display: grid;
  grid-template-columns: 1.4fr .8fr;
  gap: 25px;
  align-items: start;
}

.cart-box,
.summary-box {
  background:
    linear-gradient(
      145deg,
      #13091b,
      #0d0612
    );

  border: 1px solid #554560;
  border-radius: 18px;
  padding: 28px;

  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.cart-box h2,
.summary-box h2 {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 27px;
  margin-top: 0;
}

.cart-item {
  display: grid;
  grid-template-columns: 115px 1fr auto;
  gap: 18px;
  align-items: center;

  padding: 20px 0;

  border-top:
    1px solid #392b45;

  border-bottom:
    1px solid #392b45;
}

.cart-image {
  width: 115px;
  height: 115px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid #554560;
}

.item-name {
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 21px;
  margin-bottom: 7px;
}

.item-variant {
  color: #c9c0d0;
  margin-bottom: 10px;
}

.item-quantity {
  color: #aaa0af;
  font-size: 14px;
}

.item-price {
  font-size: 20px;
  font-weight: bold;
}

.remove-button {
  margin-top: 12px;
  padding: 0;
  background: none;
  border: 0;
  color: #d99582;
  text-decoration: underline;
  cursor: pointer;
  font-size: 14px;
}

.empty-cart {
  text-align: center;
  color: #c9c0d0;
  padding: 45px 10px;
  line-height: 1.7;
}

.continue-shopping {
  display: inline-block;
  margin-top: 15px;
  color: #d99582;
}


/* SUMMARY */

.summary-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  color: #c9c0d0;
}

.summary-total {
  display: flex;
  justify-content: space-between;
  gap: 15px;

  border-top:
    1px solid #554560;

  margin-top: 8px;
  padding-top: 20px;

  font-size: 23px;
  font-weight: bold;
}

.checkout-button {
  display: block;
  width: 100%;
  margin-top: 25px;
  padding: 16px;

  background:
    linear-gradient(
      135deg,
      #8c55a7,
      #5c2b76
    );

  color: white;

  border:
    1px solid rgba(220,220,230,.55);

  border-radius: 8px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 18px;
  text-align: center;
  text-decoration: none;

  box-shadow:
    0 8px 22px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.12);
}

.checkout-button:hover {
  background:
    linear-gradient(
      135deg,
      #a36cc0,
      #693685
    );
}

.checkout-button.disabled {
  background: #514b55;
  color: #aaa;
  pointer-events: none;
  border-color: #625b66;
}

.secure {
  text-align: center;
  color: #9f95a5;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 15px;
}


/* MOBILE */

@media screen and (max-width: 600px) {

  nav {
    padding: 20px 3px;
  }

  nav a {
    font-size: 14px;
    margin: 0 5px;
    letter-spacing: 0;
  }

  .nav-lace {
    width: 30%;
    filter: grayscale(1) contrast(1.6);
    opacity: 0.82;
  }

  .nav-center-shade {
    left: 15%;
    width: 70%;
  }

  .nav-ornament {
    font-size: 7px;
    letter-spacing: 4px;
    bottom: 1px;
  }

  main {
    width: 92%;
    margin-top: 40px;
  }

  h1 {
    font-size: 36px;
  }

  .checkout-layout {
    grid-template-columns: 1fr;
  }

  .cart-box,
  .summary-box {
    padding: 20px;
  }

  .cart-item {
    grid-template-columns: 85px 1fr;
  }

  .cart-image {
    width: 85px;
    height: 85px;
  }

  .item-price {
    grid-column: 2;
  }

}

</style>
</head>


<body>


<nav>

  <img
    src="lace.jpg"
    class="nav-lace lace-left"
    alt=""
  >

  <img
    src="lace.jpg"
    class="nav-lace lace-right"
    alt=""
  >

  <span class="nav-center-shade"></span>

  <a href="index.html">Home</a>
  <a href="boxes.html">Boxes</a>
  <a href="about.html">About Us</a>
  <a href="contact.html">Contact</a>
  <a href="checkout.html">Checkout</a>

  <span class="nav-ornament">
    ◆ ✦ ◆ ✦ ◆
  </span>

</nav>


<main>

  <h1>
    Checkout
  </h1>


  <div class="checkout-layout">


    <div class="cart-box">

      <h2>
        Your Cart
      </h2>

      <div id="cartContents">
      </div>

    </div>


    <div class="summary-box">

      <h2>
        Order Summary
      </h2>


      <div class="summary-row">

        <span>
          Subtotal
        </span>

        <span id="subtotal">
          $0.00
        </span>

      </div>


      <div class="summary-row">

        <span>
          Shipping
        </span>

        <span>
          Calculated at checkout
        </span>

      </div>


      <div class="summary-total">

        <span>
          Total
        </span>

        <span id="orderTotal">
          $0.00
        </span>

      </div>


      <a
        id="checkoutButton"
        class="checkout-button disabled"
        href="#"
      >
        Proceed to Secure Checkout
      </a>


      <div class="secure">

        Secure payment processing provided by Square.

      </div>

    </div>


  </div>

</main>



<script>


function getCart() {

  try {

    return (
      JSON.parse(
        localStorage.getItem("ravensScoopsCart")
      ) || []
    );

  }

  catch (error) {

    return [];

  }

}



function displayCart() {

  const cart =
    getCart();


  const cartContents =
    document.getElementById("cartContents");


  const subtotal =
    document.getElementById("subtotal");


  const orderTotal =
    document.getElementById("orderTotal");


  const checkoutButton =
    document.getElementById("checkoutButton");


  if (cart.length === 0) {

    cartContents.innerHTML = `

      <div class="empty-cart">

        Your cart is currently empty.

        <br>

        <a
          href="boxes.html"
          class="continue-shopping"
        >
          Continue Shopping
        </a>

      </div>

    `;


    subtotal.textContent =
      "$0.00";


    orderTotal.textContent =
      "$0.00";


    checkoutButton.classList.add(
      "disabled"
    );


    checkoutButton.href =
      "#";


    return;

  }


  let html = "";

  let total = 0;


  cart.forEach(function(item) {

    total +=
      item.price * item.quantity;


    html += `

      <div class="cart-item">

        <img
          src="${item.image}"
          alt="${item.name}"
          class="cart-image"
        >


        <div>

          <div class="item-name">
            ${item.name}
          </div>


          <div class="item-variant">
            ${item.variant}
          </div>


          <div class="item-quantity">
            Quantity: ${item.quantity}
          </div>


          <button
            class="remove-button"
            onclick="removeItem('${item.id}')"
          >
            Remove
          </button>

        </div>


        <div class="item-price">

          $${(
            item.price * item.quantity
          ).toFixed(2)}

        </div>

      </div>

    `;

  });


  cartContents.innerHTML =
    html;


  subtotal.textContent =
    "$" + total.toFixed(2);


  orderTotal.textContent =
    "$" + total.toFixed(2);


  checkoutButton.classList.remove(
    "disabled"
  );


  checkoutButton.href =
    "https://square.link/u/gJmoBJvQ";

}



function removeItem(id) {

  let cart =
    getCart();


  cart =
    cart.filter(
      item => item.id !== id
    );


  localStorage.setItem(
    "ravensScoopsCart",
    JSON.stringify(cart)
  );


  displayCart();

}



displayCart();


</script>


</body>

</html>
