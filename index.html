<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ravens Scoops</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #08030d;
  color: white;
}


/* MAIN NAVIGATION */

nav {
  position: relative;
  width: 100%;
  text-align: center;
  padding: 30px 10px;

  background:
    radial-gradient(
      circle at center,
      #55206f 0%,
      #411456 48%,
      #291033 100%
    );

  border-top: 1px solid rgba(225, 228, 235, 0.20);
  border-bottom: 1px solid #bfc3cc;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);

  overflow: hidden;
  z-index: 10;
}


/* SILVER SHINE ACROSS TOP */

nav::before {
  content: "";

  position: absolute;

  top: 0;
  left: 10%;

  width: 80%;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.45),
      transparent
    );

  z-index: 3;
}


/* REAL BLACK LACE */

.nav-lace {
  position: absolute;

  top: 0;

  width: 36%;
  height: 100%;

  object-fit: cover;
  object-position: left center;

  pointer-events: none;

  z-index: 1;

  filter:
    grayscale(1)
    contrast(1.65);

  mix-blend-mode: multiply;

  opacity: 0.88;
}


/* LEFT LACE */

.lace-left {
  left: 0;

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


/* RIGHT LACE */

.lace-right {
  right: 0;

  transform: scaleX(-1);

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


/* CLEAN CENTER BEHIND MENU */

.nav-center-shade {
  position: absolute;

  top: 0;
  left: 22%;

  width: 56%;
  height: 100%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(31, 7, 41, .94) 0%,
      rgba(31, 7, 41, .80) 48%,
      rgba(31, 7, 41, .36) 72%,
      transparent 100%
    );

  pointer-events: none;

  z-index: 2;
}


/* NAVIGATION LINKS */

nav a {
  position: relative;

  z-index: 5;

  color: #f5f1f7;

  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 19px;
  font-weight: normal;

  letter-spacing: 1px;

  margin: 0 24px;

  text-shadow:
    0 1px 4px rgba(0,0,0,.95);

  transition:
    color .25s ease,
    text-shadow .25s ease;
}


nav a::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  width: 0;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      #ffffff,
      transparent
    );

  transform: translateX(-50%);

  transition: width .25s ease;
}


nav a:hover {
  color: #ffffff;

  text-shadow:
    0 0 8px rgba(220,205,255,.85),
    0 0 15px rgba(130,70,175,.6);
}


nav a:hover::after {
  width: 100%;
}


/* CENTER SILVER ORNAMENT */

.nav-ornament {
  position: absolute;

  left: 50%;
  bottom: 2px;

  transform: translateX(-50%);

  color: #e0e2e8;

  font-size: 9px;
  letter-spacing: 8px;

  z-index: 6;

  opacity: .85;

  white-space: nowrap;
}


/* HOME RAVEN IMAGE */

.home-image {
  display: block;

  width: calc(100% - 30px);
  max-width: 850px;

  height: auto;

  margin: 36px auto 55px auto;

  border: 1px solid rgba(215,218,228,.5);

  box-shadow:
    0 0 0 5px rgba(70,27,88,.17),
    0 20px 55px rgba(0,0,0,.75),
    0 0 38px rgba(130,90,160,.22);
}


/* CONTACT FOOTER */

.contact-footer {
  position: relative;

  width: 100%;

  text-align: center;

  padding: 35px 20px 30px;

  background:
    radial-gradient(
      circle at center,
      #55206f 0%,
      #411456 48%,
      #291033 100%
    );

  border-top: 1px solid #bfc3cc;
  border-bottom: 1px solid rgba(225,228,235,.20);

  box-shadow:
    0 -8px 25px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.06);

  overflow: hidden;
}


/* FOOTER LACE */

.footer-lace {
  position: absolute;

  top: 0;

  width: 36%;
  height: 100%;

  object-fit: cover;
  object-position: left center;

  pointer-events: none;

  z-index: 1;

  filter:
    grayscale(1)
    contrast(1.65);

  mix-blend-mode: multiply;

  opacity: 0.88;
}


.footer-lace-left {
  left: 0;

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


.footer-lace-right {
  right: 0;

  transform: scaleX(-1);

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 35%,
      rgba(0,0,0,.95) 50%,
      rgba(0,0,0,.7) 65%,
      rgba(0,0,0,.3) 82%,
      transparent 100%
    );
}


/* FOOTER CENTER SHADE */

.footer-center-shade {
  position: absolute;

  top: 0;
  left: 22%;

  width: 56%;
  height: 100%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(31,7,41,.94) 0%,
      rgba(31,7,41,.80) 48%,
      rgba(31,7,41,.36) 72%,
      transparent 100%
    );

  pointer-events: none;

  z-index: 2;
}


/* FOOTER CONTENT */

.footer-content {
  position: relative;

  z-index: 5;
}


.footer-content h2 {
  margin: 0 0 10px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 27px;

  font-weight: normal;

  letter-spacing: 1px;

  color: white;
}


.footer-content p {
  margin: 8px 0;

  font-family: Arial, sans-serif;

  color: #d5ced9;

  font-size: 15px;
}


.footer-email {
  display: inline-block;

  margin-top: 8px;

  color: white;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 17px;

  text-decoration: none;

  border-bottom:
    1px solid rgba(255,255,255,.55);

  padding-bottom: 3px;
}


.footer-email:hover {
  text-shadow:
    0 0 8px rgba(220,205,255,.85);
}


.footer-ornament {
  margin-top: 18px;

  color: #e0e2e8;

  font-size: 9px;

  letter-spacing: 8px;

  opacity: .85;
}


/* MOBILE */

@media screen and (max-width: 600px) {

  nav {
    padding: 20px 3px;
  }


  nav a {
    font-size: 14px;
    margin: 0 5px;
    letter-spacing: 0;
  }


  .nav-lace {
    width: 30%;

    filter:
      grayscale(1)
      contrast(1.6);

    opacity: 0.82;
  }


  .nav-center-shade {
    left: 15%;
    width: 70%;
  }


  .nav-ornament {
    font-size: 7px;
    letter-spacing: 4px;
    bottom: 1px;
  }


  .home-image {
    width: 100%;

    margin-top: 28px;
    margin-bottom: 45px;

    border-left: 0;
    border-right: 0;

    box-shadow:
      0 10px 35px rgba(0,0,0,.7),
      0 0 25px rgba(120,75,150,.18);
  }


  .contact-footer {
    padding: 30px 15px 25px;
  }


  .footer-lace {
    width: 30%;

    filter:
      grayscale(1)
      contrast(1.6);

    opacity: 0.82;
  }


  .footer-center-shade {
    left: 15%;
    width: 70%;
  }


  .footer-content h2 {
    font-size: 23px;
  }


  .footer-content p {
    font-size: 14px;
  }


  .footer-email {
    font-size: 16px;
  }


  .footer-ornament {
    font-size: 7px;
    letter-spacing: 4px;
  }

}

</style>

</head>
