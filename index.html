<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050308;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Fills the empty space */
.background {
  position: fixed;
  inset: -30px;
  background-image: url("ravens-scoops-coming-soon.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(22px) brightness(45%);
  transform: scale(1.12);
  z-index: 0;
}

/* Your ORIGINAL picture */
.main-image {
  position: relative;
  z-index: 1;
  display: block;
  width: auto;
  height: auto;
  max-width: 100vw;
  max-height: 100vh;
  object-fit: contain;
}

</style>
</head>

<body>

<div class="background"></div>

<img
  class="main-image"
  src="ravens-scoops-coming-soon.png"
  alt="Ravens Scoops Coming Soon">

</body>
</html>
