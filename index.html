<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #050308;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: -30px;
  background: url("ravens-scoops-coming-soon.png") center/cover no-repeat;
  filter: blur(25px) brightness(35%);
  transform: scale(1.1);
  z-index: -1;
}

.main-image {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
}
</style>
</head>

<body>
<img class="main-image"
     src="ravens-scoops-coming-soon.png"
     alt="Ravens Scoops Coming Soon">
</body>
</html>
