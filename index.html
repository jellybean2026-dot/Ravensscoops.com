<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #08030d;
  color: white;
}


/* NAVIGATION */

nav {
  position: relative;
  width: 100%;
  text-align: center;
  padding: 30px 10px;

  background:
    radial-gradient(
      circle at center,
      #55206f 0%,
      #351044 45%,
      #17081f 100%
    );

  border-top: 1px solid rgba(225, 228, 235, 0.35);
  border-bottom: 1px solid #bfc3cc;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.09);

  overflow: visible;
  z-index: 10;
}


/* SILVER SHINE ALONG TOP */

nav::before {
  content: "";
  position: absolute;
  top: 0;
  left: 8%;
  width: 84%;
  height: 1px;

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.6),
      transparent
    );

  z-index: 3;
}


/* CENTER ORNAMENT UNDER NAV */

nav::after {
  content: "◆  ✦  ◆  ✦  ◆";

  position: absolute;

  left: 50%;
  bottom: -14px;

  transform: translateX(-50%);

  color: #d7d9df;
  background: #08030d;

  padding: 0 15px;

  font-size: 10px;
  letter-spacing: 8px;

  white-space: nowrap;

  z-index: 5;
}


/* ACTUAL LACE / FILIGREE */

.nav-lace {
  position: absolute;

  top: 0;

  width: 32%;
  height: 100%;

  z-index: 1;

  pointer-events: none;

  opacity: 0.55;
}


/* LEFT LACE */

.lace-left {
  left: 0;

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      rgba(0,0,0,.75) 55%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      rgba(0,0,0,.75) 55%,
      transparent 100%
    );
}


/* RIGHT LACE */

.lace-right {
  right: 0;

  transform: scaleX(-1);

  -webkit-mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      rgba(0,0,0,.75) 55%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to right,
      black 0%,
      black 30%,
      rgba(0,0,0,.75) 55%,
      transparent 100%
    );
}


/* NAVIGATION LINKS */

nav a {
  position: relative;

  z-index: 10;

  color: #f5f1f7;

  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 19px;

  font-weight: normal;

  letter-spacing: 1px;

  margin: 0 24px;

  text-shadow:
    0 1px 3px rgba(0,0,0,.9);

  transition:
    color .25s ease,
    text-shadow .25s ease;
}


/* SILVER HOVER UNDERLINE */

nav a::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  width: 0;
  height: 1px;

  background:
    linear-gradient(
      to right,
      #8d919b,
      #ffffff,
      #8d919b
    );

  transform: translateX(-50%);

  transition: width .25s ease;
}


nav a:hover {
  color: #ffffff;

  text-shadow:
    0 0 8px rgba(214,196,255,.8),
    0 0 14px rgba(123,67,160,.5);
}


nav a:hover::after {
  width: 100%;
}


/* HOME IMAGE */

.home-image {
  display: block;

  width: calc(100% - 30px);
  max-width: 1200px;

  height: auto;

  margin: 36px auto 55px auto;

  border: 1px solid rgba(215,218,228,.5);

  box-shadow:
    0 0 0 5px rgba(70,27,88,.17),
    0 20px 55px rgba(0,0,0,.75),
    0 0 38px rgba(130,90,160,.22);
}


/* MOBILE */

@media screen and (max-width: 600px) {

  nav {
    padding: 20px 3px;
  }

  nav a {
    font-size: 14px;
    margin: 0 5px;
    letter-spacing: 0;
  }

  .nav-lace {
    width: 25%;
    opacity: 0.35;
  }

  nav::after {
    font-size: 8px;
    letter-spacing: 4px;
    bottom: -12px;
  }

  .home-image {
    width: 100%;
    margin-top: 28px;

    border-left: 0;
    border-right: 0;

    box-shadow:
      0 10px 35px rgba(0,0,0,.7),
      0 0 25px rgba(120,75,150,.18);
  }

}

</style>
