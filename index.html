<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ravens Scoops</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #08030d;
    }


    /* TOP NAVIGATION */

    nav {
      width: 100%;
      text-align: center;
      padding: 18px 8px;

      background: linear-gradient(
        to bottom,
        #6d28a8,
        #4b176e
      );

      border-bottom: 2px solid #a77bd1;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.6);

      position: relative;
    }


    nav a {
      color: #ffffff;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      margin: 0 14px;
    }


    nav a:hover {
      color: #e6d1ff;
    }


    /* DECORATIVE TRIM */

    nav::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -8px;

      width: 100%;
      height: 8px;

      background:
        radial-gradient(
          circle at 8px 0,
          #a77bd1 0,
          #a77bd1 4px,
          transparent 5px
        );

      background-size: 16px 8px;
      background-repeat: repeat-x;
    }


    /* MAIN HOME IMAGE */

    .home-image {
      display: block;

      width: 100%;
      max-width: 900px;

      height: auto;

      margin: 8px auto 0 auto;
    }


    /* MOBILE */

    @media screen and (max-width: 600px) {

      nav {
        padding: 16px 4px;
      }

      nav a {
        font-size: 14px;
        margin: 0 5px;
      }

    }

  </style>
</head>


<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="boxes.html?v=2">Boxes</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="checkout.html">Checkout</a>
  </nav>


  <img
    class="home-image"
    src="file_00000000844881f58d4b5c059559045b.png"
    alt="Ravens Scoops"
  >

</body>

</html>
